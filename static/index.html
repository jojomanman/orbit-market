<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Market</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<main>
  <section id="globe"><div id="wlabel" hidden></div><div id="wtime"><span id="wspeed"></span><span id="wclock"></span></div></section>
  <aside>
    <header>
      <h1>Orbit Market <a href="network" style="margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--dim); text-decoration: none">Network</a><a href="live" style="margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--dim); text-decoration: none">Live</a></h1>
      <span id="clock"></span>
    </header>

    <section id="walk">
      <div class="label" id="wstep"></div>
      <h2 id="wtitle"></h2>
      <p id="wsub"></p>
      <table id="wfacts" class="facts"></table>
      <div id="wcost"></div>
      <div id="wtotal"></div>
    </section>

    <details>
    <summary>Details</summary>
    <div class="block">
      <div class="label">Timeline</div>
      <div id="tx"></div>
    </div>
    <div class="seg" id="modes"></div>

    <div class="block">
      <div class="label">Binding</div>
      <div id="binding" class="big"></div>
      <div id="pressure" class="bars"></div>
    </div>

    <div class="block">
      <div class="label">Price by region</div>
      <table id="prices"></table>
    </div>

    <div class="block">
      <div class="label">Price, 24 h, vs anchor</div>
      <div id="history"></div>
    </div>

    <div class="block">
      <div class="label">Mechanisms, last hour</div>
      <table id="compare"></table>
    </div>

    <div class="block">
      <div class="label">Scenario</div>
      <div class="seg" id="scenarios"></div>
      <table id="scenario"></table>
    </div>

    <div class="block">
      <div class="label">Price a job <span id="target" class="dim"></span></div>
      <select id="preset"></select>
      <div id="desc" class="dim"></div>
      <form id="calc">
        <label>CPU<input name="cpu" type="number" min="0" max="64" step="1"></label>
        <label>Mem GB<input name="memory_gb" type="number" min="0" max="256"></label>
        <label>Store GB<input name="storage_gb" type="number" min="0" max="8000"></label>
        <label>Run s<input name="duration_s" type="number" min="0" max="86400"></label>
        <label>Down GB<input name="gb" type="number" min="0" step="any"></label>
        <label>Deadline s<input name="deadline_s" type="number" min="30" max="86400"></label>
        <label>Latency ms<input name="latency" type="number" min="0" placeholder="none"></label>
        <label>Max $<input name="max_price_usd" type="number" min="0" step="any"></label>
        <label class="check"><input name="reserve" type="checkbox">Priority reserve</label>
        <label>Cap $<input name="price_cap_usd" type="number" min="0" step="any"></label>
      </form>
      <table id="quote"></table>
      <div class="actions"><button id="simulate">Simulate</button><span id="job" class="dim"></span></div>
    </div>

    </details>

    <footer>
      <span id="counts"></span>
      <a href="api/prices">API</a>
      <a href="https://github.com/jojomanman/orbit-market">Source</a>
    </footer>
    <nav id="wnav"><button id="back">Back</button><span id="wdots"></span><button id="next">Next</button></nav>
  </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
