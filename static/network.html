<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Market · Network</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #07090c; --panel: #0c1015; --line: #1a2129; --edge: #27313b; --text: #c9d1d9; --dim: #6b7681;
  --a: #7cc4ff; --b: #c4a7ff; --c: #8fd19e; --hot: #ffc66b; --u: 8px;
  font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
main { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
#graph { position: relative; padding: calc(3 * var(--u)); display: grid; min-height: 0; }
svg { width: 100%; height: 100%; }
aside { background: var(--panel); border-left: 1px solid var(--line); padding: calc(3 * var(--u));
  display: grid; grid-template-rows: auto auto auto auto 1fr auto auto; gap: calc(2 * var(--u)); overflow: hidden; }
header { display: flex; justify-content: space-between; align-items: baseline; }
h1 { font-size: 15px; font-weight: 600; }
a { color: var(--dim); text-decoration: none; } a:hover { color: var(--text); }
.label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: var(--u); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); }
.seg button { background: none; border: 0; color: var(--dim); font: inherit; padding: var(--u) 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { color: var(--text); background: var(--line); }
#owners { display: flex; gap: calc(2 * var(--u)); color: var(--dim); font-size: 12px; height: 16px; }
#owners i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#send { background: var(--hot); border: 0; color: #1a1200; font: inherit; font-weight: 600; height: 40px; cursor: pointer; }
#send:disabled { background: var(--line); color: var(--dim); cursor: default; }
#steps { list-style: none; display: grid; grid-auto-rows: min-content; gap: var(--u); overflow-y: auto; }
#steps li { display: grid; grid-template-columns: 8px 1fr auto; column-gap: calc(1.5 * var(--u)); opacity: .3; transition: opacity .3s; }
#steps li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-top: 6px; }
#steps li.done { opacity: 1; } #steps li.now::before { background: var(--hot); }
#steps time { text-align: right; color: var(--dim); }
#steps small { grid-column: 2 / 4; color: var(--dim); font-size: 12px; }
#result { display: grid; grid-template-columns: 1fr 1fr; gap: calc(2 * var(--u)); padding-top: calc(2 * var(--u)); border-top: 1px solid var(--line); }
#result b { display: block; font-size: 32px; font-weight: 600; line-height: 1.2; color: var(--dim); transition: color .3s; }
#result.done b { color: var(--text); }
#cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--u); }
.card { border: 1px solid var(--line); padding: var(--u); display: grid; grid-template-columns: auto 1fr; column-gap: var(--u); font-size: 12px; color: var(--dim); white-space: nowrap; }
.card.on { border-color: var(--dim); color: var(--text); }
.card h2 { grid-column: 1 / 3; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.card dd { text-align: right; } .card p { grid-column: 1 / 3; font-size: 11px; color: var(--dim); }
#clock { position: absolute; left: calc(3 * var(--u)); top: calc(3 * var(--u)); font-size: 24px; font-weight: 600; color: var(--hot); }
#clock small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }
.node text { fill: var(--text); font-size: 13px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.node .ring { fill: var(--bg); stroke-width: 1.5; }
.node.hit .ring { stroke-width: 3; }
.edge { stroke: var(--edge); stroke-width: 1.25; fill: none; }
.edge.gs { stroke-dasharray: 6 4; } .edge.isl { stroke-dasharray: 1 4; stroke-linecap: round; }
.edge.hit { stroke: var(--hot); stroke-width: 2.5; stroke-dasharray: 8 6; animation: flow .6s linear infinite; }
.edge.hit.rev { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.band { fill: var(--dim); font-size: 11px; letter-spacing: .1em; }
.legend text { fill: var(--dim); font-size: 11px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #clock { position: static; } aside { overflow: visible; } }
</style>
</head>
<body>
<main>
  <section id="graph">
    <div id="clock">T+0:00<small>Ship detection, Port of Rotterdam, deliver within 15 min</small><small id="blocks"></small></div>
    <svg id="svg" viewBox="0 0 960 600">
      <defs>
        <symbol id="i-user" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="16" cy="11" r="5"/><path d="M6 27c1-6 5-9 10-9s9 3 10 9"/></g></symbol>
        <symbol id="i-dc" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="5" width="18" height="6"/><rect x="7" y="13" width="18" height="6"/><rect x="7" y="21" width="18" height="6"/><path d="M10 8h4M10 16h4M10 24h4"/></g></symbol>
        <symbol id="i-up" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 14a10 10 0 0 0 14 6z"/><path d="M13 17l-3 10h8l-2-6"/><path d="M22 12l4-4M22 8h4v4"/></g></symbol>
        <symbol id="i-down" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 14a10 10 0 0 0 14 6z"/><path d="M13 17l-3 10h8l-2-6"/><path d="M26 8l-4 4M22 8v4h4"/></g></symbol>
        <symbol id="i-sar" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="6" width="8" height="8"/><path d="M4 17h24v3H4z"/><path d="M11 25q5 3 10 0M8 28q8 4 16 0"/></g></symbol>
        <symbol id="i-cmp" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="11" y="11" width="10" height="10"/><path d="M13 8v3M16 8v3M19 8v3M13 21v3M16 21v3M19 21v3"/><path d="M2 13h6v6H2zM24 13h6v6h-6z"/></g></symbol>
        <symbol id="i-rel" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="8" height="8"/><path d="M3 14h6v4H3zM23 14h6v4h-6z"/><path d="M11 10a6 6 0 0 1 10 0"/><path d="M16 4v4"/></g></symbol>
      </defs>
      <text class="band" x="0" y="76">GEO</text>
      <text class="band" x="0" y="236">LEO</text>
      <text class="band" x="0" y="396">GROUND</text>
      <text class="band" x="0" y="516">FIBER</text>
      <g id="edges"></g><g id="nodes"></g>
      <circle id="dot" r="6" fill="var(--hot)" visibility="hidden"/>
      <g class="legend" transform="translate(712 584)">
        <line class="edge" x1="0" y1="0" x2="24" y2="0"/><text x="32" y="4">fiber</text>
        <line class="edge gs" x1="72" y1="0" x2="96" y2="0"/><text x="104" y="4">radio</text>
        <line class="edge isl" x1="152" y1="0" x2="176" y2="0"/><text x="184" y="4">laser</text>
      </g>
    </svg>
  </section>
  <aside>
    <header><h1>Orbit Market · Network</h1><span><a href="./">Globe</a> · <a href="live">Live</a></span></header>
    <div class="seg" id="tabs"></div>
    <div id="owners"></div>
    <button id="send">Send request</button>
    <ol id="steps"></ol>
    <div id="result"><div><div class="label">Delivered</div><b id="r-time"></b></div><div><div class="label">Price</div><b id="r-price"></b></div></div>
    <div><div class="label">Same request, three rules</div><div id="cards"></div></div>
  </aside>
</main>
<script>
"use strict";
// The request travels as a loop with no crossing links: up the left (customer, entry DC, uplink), across the top
// (GEO relay fans out to the LEO row, laser links only between neighbours), down the right (downlink, DC) and back
// along the fiber row. Owners: A runs the relay, compute A1 and the European ground; B one SAR sat; C a second
// constellation with its own downlink and DC.
const NODES = {
  u1: ["user", "Port authority", 72, 500, "U"], dc1: ["dc", "DC Frankfurt", 216, 500, "A"],
  up1: ["up", "Uplink Kiruna", 216, 380, "A"], rel1: ["rel", "Relay (GEO)", 528, 72, "A"],
  sar1: ["sar", "SAR B2", 336, 224, "B"], cmp1: ["cmp", "Compute A1", 464, 224, "A"],
  sar2: ["sar", "SAR C2", 592, 224, "C"], cmp2: ["cmp", "Compute C1", 720, 224, "C"],
  dn1: ["down", "Downlink Svalbard", 864, 380, "C"], dc2: ["dc", "DC Stockholm", 864, 500, "C"],
};
// [a, b, type, control point]; long links bend around the LEO row, short ones are straight.
const EDGES = [
  ["u1", "dc1", "fiber"], ["dc1", "up1", "fiber"], ["dn1", "dc2", "fiber"], ["dc2", "dc1", "fiber"],
  ["up1", "rel1", "gs", [216, 72]], ["rel1", "dn1", "gs", [864, 72]],
  ...["sar1", "cmp1", "sar2", "cmp2"].map(s => ["rel1", s, "isl"]),
  ["sar1", "cmp1", "isl"], ["cmp1", "sar2", "isl"], ["sar2", "cmp2", "isl"],
];
const OWNER_COLOR = { A: "var(--a)", B: "var(--b)", C: "var(--c)", U: "var(--dim)" };

// One physical world for all three rules (docs/GOVERNANCE.md). Only who decides, how long deciding takes and
// what is paid differ, so the comparison is fair.
const PASS = { sar1: 45, sar2: 540 };     // next SAR access over the port, s from request
const CAPTURE = 15, ISL_RAW = 4, DETECT = 40, FIBER = 0.05, HOP = 0.3;
const COST = 264;                          // providers' summed reserve cost for the job, $ (MODEL-style legs)
const BLOCK = 12;                          // Ethereum slot time, s

const VARIANTS = {
  central: {
    name: "Centralized", price: COST * 1.4, trust: "operator", join: "owner only", chain: false,
    decide: [["u1", "dc1", 1, "Operator schedules SAR B2", "operator decides"]],
    settle: () => "Port pays operator $" + Math.round(COST * 1.4),
  },
  contract: {
    name: "Contract", price: COST * 1.18 * 1.02, trust: "contract", join: "signatories", chain: false,
    decide: [["u1", "dc1", 0.5, "Port sends RFQ to A", "Port decides"],
             ["dc1", "dc1", 2.5, "A, B, C quote from own passes", "each owner decides"],
             ["dc1", "dc1", 0.5, "SAR B2 wins, paid 2nd price", "contract decides · Port pays escrow"]],
    settle: () => "Escrow pays B, A, C per leg, 2 % fee",
  },
  crypto: {
    name: "Decentralized", price: COST * 1.15 + 2, trust: "code + stake", join: "anyone staking", chain: true,
    decide: [["u1", "dc1", BLOCK, "Order posted on-chain", "Port decides · escrow + gas"],
             ["dc1", "dc1", 2 * BLOCK, "Providers bid for 2 blocks", "each provider decides · stake locked"],
             ["dc1", "dc1", BLOCK, "B2 pass missed, SAR C2 wins", "smart contract decides"]],
    settle: () => "Proof in next block, escrow pays in tokens",
  },
};

// Physical legs after the decision: one optimal path given which pass the decision still catches.
function run(key) {
  const v = VARIANTS[key], steps = [];
  let t = 0;
  for (const [a, b, dt, text, sub] of v.decide) { t += dt; steps.push({ hops: [a, b], t, text, sub }); }
  const sar = t <= PASS.sar1 ? "sar1" : "sar2", cmp = sar === "sar1" ? "cmp1" : "cmp2", paid = key !== "central";
  t += 3 * HOP;
  steps.push({ hops: ["dc1", "up1", "rel1", sar], t, text: "Tasking up via Kiruna and relay", sub: paid ? "A paid transit" : "" });
  t = PASS[sar] + CAPTURE;
  steps.push({ hops: [sar], t, text: NODES[sar][1] + " images the port", sub: "next pass at " + fmt(PASS[sar]) });
  t += ISL_RAW;
  steps.push({ hops: [sar, cmp], t, text: "2 GB raw by laser to " + NODES[cmp][1], sub: "" });
  t += DETECT;
  steps.push({ hops: [cmp], t, text: "Ships detected on board", sub: "2 MB result" });
  t += 2 * HOP + 2 * FIBER;
  steps.push({ hops: [cmp, "rel1", "dn1", "dc2", "dc1", "u1"], t, text: "Result down to the port", sub: "" });
  const delivered = t;
  steps.push({ hops: [], t: v.chain ? t + BLOCK : t, text: v.settle(), sub: "" });
  return { steps, delivered };
}

const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const money = x => "$" + Math.round(x);
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const edgeEls = {}, nodeEls = {};
for (const [a, b, type, c] of EDGES) {
  const [, , x1, y1] = NODES[a], [, , x2, y2] = NODES[b], [cx, cy] = c || [(x1 + x2) / 2, (y1 + y2) / 2];
  edgeEls[a + "-" + b] = el("path", { class: "edge " + type, d: `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}` }, $("edges"));
}
for (const id in NODES) {
  const [icon, label, x, y] = NODES[id];
  const g = el("g", { class: "node", transform: `translate(${x} ${y})` }, $("nodes"));
  el("circle", { class: "ring", r: 24 }, g);
  el("use", { href: "#i-" + icon, x: -16, y: -16, width: 32, height: 32 }, g);
  // Labels sit where no link runs: relay above, stations on the inner side, the rest below.
  const side = { rel1: [0, -36, "middle"], up1: [36, 5, "start"], dn1: [-36, 5, "end"] }[id] || [0, 44, "middle"];
  el("text", { x: side[0], y: side[1], "text-anchor": side[2] }, g).textContent = label;
  nodeEls[id] = g;
}

let variant = "central", runId = 0;
function paint() {
  for (const id in NODES) {
    const o = NODES[id][4], col = o === "U" ? OWNER_COLOR.U : variant === "central" ? OWNER_COLOR.A : OWNER_COLOR[o];
    nodeEls[id].querySelector(".ring").setAttribute("stroke", col);
    nodeEls[id].querySelector("use").style.color = col;
  }
  $("owners").innerHTML = variant === "central" ? '<span><i style="background: var(--a)"></i>one operator owns all</span>'
    : ["A", "B", "C"].map(o => `<span><i style="background: ${OWNER_COLOR[o]}"></i>owner ${o}</span>`).join("");
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.k === variant);
  for (const c of $("cards").children) c.classList.toggle("on", c.dataset.k === variant);
}
function reset() {
  runId++;
  for (const e of Object.values(edgeEls)) e.classList.remove("hit", "rev");
  for (const n of Object.values(nodeEls)) n.classList.remove("hit");
  $("dot").setAttribute("visibility", "hidden");
  const r = run(variant);
  $("steps").replaceChildren(...r.steps.map(s => {
    const li = h("li");
    li.append(h("span", "", s.text), h("time", "", fmt(s.t)));
    if (s.sub) li.append(h("small", "", s.sub));
    return li;
  }));
  $("r-time").textContent = fmt(r.delivered);
  $("r-price").textContent = money(VARIANTS[variant].price);
  $("result").classList.remove("done");
  $("send").disabled = false;
  setClock(0);
}
function setClock(t) {
  $("clock").firstChild.textContent = "T+" + fmt(t);
  $("blocks").textContent = VARIANTS[variant].chain ? "Chain block " + Math.floor(t / BLOCK) + ", 12 s each" : "";
}
function select(k) { variant = k; reset(); paint(); }

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function travel(a, b, id) {
  const fwd = edgeEls[a + "-" + b], p = fwd || edgeEls[b + "-" + a], L = p.getTotalLength(), dot = $("dot");
  p.classList.add("hit"); if (!fwd) p.classList.add("rev");
  dot.setAttribute("visibility", "visible");
  const t0 = performance.now(), dur = 120 + L * 0.5;
  for (let f = 0; f < 1 && id === runId; f = (performance.now() - t0) / dur) {
    const pt = p.getPointAtLength(fwd ? f * L : (1 - f) * L);
    dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
    await new Promise(requestAnimationFrame);
  }
  dot.setAttribute("visibility", "hidden");
}
async function send() {
  reset();
  const id = runId, items = $("steps").children;
  $("send").disabled = true;
  for (const [i, s] of run(variant).steps.entries()) {
    items[i].classList.add("now");
    for (let j = 0; j + 1 < s.hops.length; j++) if (s.hops[j] !== s.hops[j + 1]) await travel(s.hops[j], s.hops[j + 1], id);
    if (id !== runId) return;
    for (const n of s.hops) nodeEls[n].classList.add("hit");
    setClock(s.t);
    items[i].classList.add("done");
    await sleep(450);
    if (id !== runId) return;
    items[i].classList.remove("now");
  }
  $("result").classList.add("done");
  $("send").disabled = false;
}
$("send").onclick = send;

for (const k in VARIANTS) {
  const v = VARIANTS[k], r = run(k), b = h("button", "", v.name), c = h("div", "card");
  b.dataset.k = c.dataset.k = k;
  b.onclick = c.onclick = () => select(k);
  c.append(h("h2", "", v.name));
  for (const [dt, dd] of [["Delivered", fmt(r.delivered)], ["Price", money(v.price)]]) c.append(h("dt", "", dt), h("dd", "", dd));
  c.append(h("p", "", v.trust), h("p", "", v.join));
  $("tabs").append(b); $("cards").append(c);
}
// #contract opens a tab, #contract/play also sends the request (pitch links, screenshots).
const [tab, play] = location.hash.slice(1).split("/");
select(VARIANTS[tab] ? tab : "central");
if (play === "play") send();
</script>
</body>
</html>
